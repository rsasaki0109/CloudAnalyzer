<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">CloudAnalyzer — Catch 3D robotics regressions before they ship</title>
  <desc id="description">A dark blue marketing graphic showing robotics outputs flowing into metrics and a green CI pass gate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="40" r="230" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="120" cy="620" r="260" fill="#0f766e" opacity="0.10"/>

  <g transform="translate(76 72)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text fill="#67e8f9" font-size="20" font-weight="700" letter-spacing="4">CLOUDANALYZER / 3D QA</text>
    <text y="92" fill="#f8fafc" font-size="52" font-weight="800">Catch 3D robotics</text>
    <text y="152" fill="#f8fafc" font-size="52" font-weight="800">regressions before they ship.</text>
    <text y="208" fill="#cbd5e1" font-size="23">Reproducible metrics, reports, and pass/fail gates</text>
    <text y="242" fill="#cbd5e1" font-size="23">for SLAM, mapping, perception, and 3DGS pipelines.</text>

    <g transform="translate(0 330)">
      <rect width="146" height="42" rx="21" fill="#123454" stroke="#38bdf8" stroke-opacity="0.65"/>
      <text x="73" y="27" text-anchor="middle" fill="#e0f2fe" font-size="17" font-weight="700">SLAM / LIO</text>
      <rect x="160" width="130" height="42" rx="21" fill="#123454" stroke="#38bdf8" stroke-opacity="0.65"/>
      <text x="225" y="27" text-anchor="middle" fill="#e0f2fe" font-size="17" font-weight="700">LiDAR</text>
      <rect x="304" width="138" height="42" rx="21" fill="#123454" stroke="#38bdf8" stroke-opacity="0.65"/>
      <text x="373" y="27" text-anchor="middle" fill="#e0f2fe" font-size="17" font-weight="700">3DGS</text>
      <rect x="456" width="112" height="42" rx="21" fill="#123454" stroke="#38bdf8" stroke-opacity="0.65"/>
      <text x="512" y="27" text-anchor="middle" fill="#e0f2fe" font-size="17" font-weight="700">CI</text>
    </g>
  </g>

  <g transform="translate(800 94)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <path d="M200 88 V126 M200 214 V252 M200 340 V378" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M190 116 L200 128 L210 116 M190 242 L200 254 L210 242 M190 368 L200 380 L210 368" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <rect width="400" height="88" rx="16" fill="#0d2037" stroke="#27648d" stroke-width="2"/>
      <circle cx="28" cy="30" r="9" fill="#38bdf8" filter="url(#glow)"/>
      <text x="52" y="35" fill="#7dd3fc" font-size="15" font-weight="800" letter-spacing="2">01 / CANDIDATE OUTPUTS</text>
      <text x="28" y="66" fill="#f8fafc" font-size="20">map.pcd · trajectory.tum · scene.ply</text>
    </g>

    <g transform="translate(0 126)">
      <rect width="400" height="88" rx="16" fill="#0d2037" stroke="#27648d" stroke-width="2"/>
      <circle cx="28" cy="30" r="9" fill="#2dd4bf" filter="url(#glow)"/>
      <text x="52" y="35" fill="#99f6e4" font-size="15" font-weight="800" letter-spacing="2">02 / EVIDENCE</text>
      <text x="28" y="66" fill="#f8fafc" font-size="20">metrics.json · report.html · hashes</text>
    </g>

    <g transform="translate(0 252)">
      <rect width="400" height="88" rx="16" fill="#0d2037" stroke="#27648d" stroke-width="2"/>
      <circle cx="28" cy="30" r="9" fill="#fbbf24" filter="url(#glow)"/>
      <text x="52" y="35" fill="#fde68a" font-size="15" font-weight="800" letter-spacing="2">03 / CI GATE</text>
      <text x="28" y="67" fill="#86efac" font-size="27" font-weight="800">✓ PASS</text>
      <text x="150" y="66" fill="#cbd5e1" font-size="19">or actionable FAIL</text>
    </g>
  </g>

  <text x="76" y="584" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Open source · MIT · Python 3.10+</text>
</svg>
