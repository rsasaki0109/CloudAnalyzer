[package]
name = "ca-wasm"
description = "WebAssembly bindings for the CloudAnalyzer Web viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ca-core = { path = "../ca-core" }
# bzip2 for ROS 1 bags (pure Rust, so it builds for the web).
bzip2 = "0.6"
wasm-bindgen = "0.2.129"
