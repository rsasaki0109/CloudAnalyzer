name: Python core

on:
  push:
    branches: [main]
    tags: ["core-v*"]
    paths:
      - "rust/crates/ca-core/**"
      - "rust/crates/ca-py/**"
      - "cloudanalyzer/ca/_rust.py"
      - "cloudanalyzer/tests/test_rust_core.py"
      - "cloudanalyzer/tests/test_vector_map.py"
      - "cloudanalyzer/ca/mapping_job.py"
      - "cloudanalyzer/ca/mapping_connections.py"
      - "cloudanalyzer/ca/mapping_retry.py"
      - "cloudanalyzer/ca/mapping_frames.py"
      - "cloudanalyzer/ca/mapping_patch.py"
      - "cloudanalyzer/ca/mapping_local_points.py"
      - "cloudanalyzer/ca/mapping_heights.py"
      - "cloudanalyzer/tests/test_mapping_job.py"
      - "cloudanalyzer/tests/test_copc_scale_benchmark.py"
      - "scripts/benchmark_copc_scale.py"
      - ".github/workflows/python-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust/crates/ca-core/**"
      - "rust/crates/ca-py/**"
      - "cloudanalyzer/ca/_rust.py"
      - "cloudanalyzer/tests/test_rust_core.py"
      - "cloudanalyzer/tests/test_vector_map.py"
      - "cloudanalyzer/ca/mapping_job.py"
      - "cloudanalyzer/ca/mapping_connections.py"
      - "cloudanalyzer/ca/mapping_retry.py"
      - "cloudanalyzer/ca/mapping_frames.py"
      - "cloudanalyzer/ca/mapping_patch.py"
      - "cloudanalyzer/ca/mapping_local_points.py"
      - "cloudanalyzer/ca/mapping_heights.py"
      - "cloudanalyzer/tests/test_mapping_job.py"
      - "cloudanalyzer/tests/test_copc_scale_benchmark.py"
      - "scripts/benchmark_copc_scale.py"
      - ".github/workflows/python-core.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/crates/ca-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates/ca-py
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/crates/ca-py
          command: build
          # abi3: one wheel per platform covers Python >= 3.10.
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: rust/crates/ca-py/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/crates/ca-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: rust/crates/ca-py/dist

  test:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglu1-mesa libegl1 libusb-1.0-0
      - name: Install CloudAnalyzer with the core
        run: |
          pip install --upgrade pip
          pip install -e ./cloudanalyzer pytest psutil "laspy[lazrs]"
          pip install dist/*.whl
      - name: Rust core agrees with Open3D and laspy
        working-directory: cloudanalyzer
        run: python -m pytest -q tests/test_rust_core.py tests/test_metrics.py tests/test_io.py tests/test_vector_map.py tests/test_mapping_job.py tests/test_http_ranges.py tests/test_copc_stream.py tests/test_copc_tiles.py tests/test_copc_scale_benchmark.py

  publish:
    # Push a tag such as `core-v0.1.0` to publish to PyPI (trusted publishing).
    if: startsWith(github.ref, 'refs/tags/core-v')
    needs: [lint, wheels, sdist, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-core
      url: https://pypi.org/project/cloudanalyzer-core/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
