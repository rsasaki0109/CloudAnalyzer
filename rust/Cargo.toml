[workspace]
resolver = "3"
members = ["crates/ca-core", "crates/ca-wasm"]
# The Python extension links against Python and is built by maturin on its own.
exclude = ["crates/ca-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rsasaki0109/CloudAnalyzer"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
