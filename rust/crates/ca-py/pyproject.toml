[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cloudanalyzer-core"
description = "Fast point cloud I/O, distances, ICP and filters from the CloudAnalyzer Rust core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/rsasaki0109/CloudAnalyzer"

[tool.maturin]
python-source = "python"
module-name = "cloudanalyzer_core._core"
features = ["pyo3/extension-module"]
