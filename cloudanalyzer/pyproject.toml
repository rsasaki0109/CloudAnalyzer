[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudanalyzer"
dynamic = ["version"]
description = "CLI-first QA toolkit for point cloud, trajectory, and 3D perception outputs"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "rsasaki0109"},
]
keywords = [
    "point-cloud",
    "slam",
    "lidar",
    "trajectory",
    "benchmark",
    "qa",
    "open3d",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "open3d>=0.17.0,<0.20",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
    "laspy>=2.5.0",
    "lazrs>=0.6.0",
    "scipy>=1.6.0",
]

[project.scripts]
ca = "cloudanalyzer_cli.main:main"

[project.urls]
Homepage = "https://github.com/rsasaki0109/CloudAnalyzer"
Repository = "https://github.com/rsasaki0109/CloudAnalyzer"
Issues = "https://github.com/rsasaki0109/CloudAnalyzer/issues"
Documentation = "https://github.com/rsasaki0109/CloudAnalyzer#readme"

[project.optional-dependencies]
benchmark = ["psutil>=5.9"]
dev = [
    "build>=1.2.2",
    "mypy",
    "pkginfo>=1.12.0",
    "pytest",
    "psutil>=5.9",
    "pyproj>=3.6",
    "ruff==0.17.3",
    "twine>=6.0.0",
]
fast = [
    "cloudanalyzer-core>=0.1",
]
mcp = [
    "cloudanalyzer-core>=0.1",
    "mcp>=1.2",
]
slam = [
    "kiss-icp>=1.2.0",
    "kiss-slam>=0.0.2",
    "small_gicp>=1.0.0",
]
ros = [
    "rosbags>=0.10",
    "mcap>=1.2",
    "zstandard>=0.22",
]
gs = [
    "torch>=2.0.0",
    "gsplat>=1.0.0",
    "lpips>=0.1.4",
    "dreamsim>=0.2.1",
]
perceptual = [
    "torch>=2.0.0",
    "lpips>=0.1.4",
    "dreamsim>=0.2.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
ca = ["web_viewer.html"]

[tool.setuptools.dynamic]
version = {attr = "ca.__version__"}

[tool.setuptools.packages.find]
include = ["ca*", "cloudanalyzer_cli*"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Bug-focused rules only: syntax errors, pyflakes (unused or undefined names),
# bugbear and pylint errors. Style rules stay off; the code uses compact
# one-line statements on purpose.
select = ["E9", "F", "B", "PLE"]
ignore = [
    "B007",  # unused loop variables often document tuple structure
    "B008",  # typer.Option(...) defaults are the idiomatic CLI pattern
    "B023",  # closures here are called within the same loop iteration
    "B904",  # raise ... from err: not enforced yet
    "B905",  # zip(strict=...): not enforced yet
]

[tool.ruff.lint.per-file-ignores]
# Shared pytest fixtures are imported from other test modules and then
# shadowed by test parameters of the same name.
"tests/**" = ["F811"]
# Byte-identical to the version recorded by benchmarks/cpu/io real-source
# receipts; fix when the file next changes for another reason.
"tests/test_io_binary_xyz_ply.py" = ["F841"]
