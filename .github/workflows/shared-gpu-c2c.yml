name: Shared GPU C2C experiment

on:
  push:
    branches: [main]
    paths:
      - "web/experiments/shared-gpu-c2c/**"
      - "web/scripts/*shared-gpu-c2c.mjs"
      - "web/scripts/build-shared-gpu-driver.mjs"
      - "web/scripts/*query-export.mjs"
      - "web/scripts/build-gpu-frontend.mjs"
      - "web/scripts/benchmark-inherited-bounds.mjs"
      - "web/scripts/benchmark-gpu-diagnostics.mjs"
      - "web/scripts/benchmark-box-bounds.mjs"
      - "web/tests/gpu-boxes.test.mjs"
      - "web/tests/gpu-box-bounds-packet.test.mjs"
      - "benchmarks/wasm-gpu-box-bounds/**"
      - "web/scripts/benchmark-parent-traversal.mjs"
      - "web/tests/gpu-parents.test.mjs"
      - "web/tests/gpu-parent-traversal-packet.test.mjs"
      - "benchmarks/wasm-gpu-parent-traversal/**"
      - "web/scripts/benchmark-compact-stack.mjs"
      - "web/tests/gpu-compact-stack.test.mjs"
      - "web/tests/gpu-compact-stack-packet.test.mjs"
      - "benchmarks/wasm-gpu-compact-stack/**"
      - "web/scripts/benchmark-packed-nodes.mjs"
      - "web/tests/gpu-packed-nodes.test.mjs"
      - "web/tests/gpu-packed-nodes-packet.test.mjs"
      - "benchmarks/wasm-gpu-packed-nodes/**"
      - "web/scripts/*reference-preparation*.mjs"
      - "web/tests/gpu-reference-preparation*.test.mjs"
      - "benchmarks/wasm-reference-preparation/**"
      - "web/tests/gpu-diagnostics.test.mjs"
      - "benchmarks/wasm-gpu-diagnostics/**"
      - "web/tests/inherited-bounds-packet.test.mjs"
      - "benchmarks/wasm-gpu-inherited-bounds/**"
      - "web/tests/query-export-packet.test.mjs"
      - "web/tests/owned-query-export-packet.test.mjs"
      - "benchmarks/wasm-owned-query-export/**"
      - "benchmarks/wasm-query-export/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/tests/shared-gpu-c2c-order.test.mjs"
      - "web/tests/shared-gpu-packets.test.mjs"
      - "benchmarks/wasm-shared-gpu-fresh/**"
      - "benchmarks/wasm-shared-gpu-overlap/**"
      - "benchmarks/wasm-shared-gpu-c2c/**"
      - "web/src/worker.ts"
      - "web/src/pool.ts"
      - "web/src/gpu-c2c.ts"
      - "web/src/gpu-candidates.ts"
      - "web/src/gpu-verifiers.ts"
      - "web/src/gpu-diagnostics.ts"
      - "web/src/c2c-worker.ts"
      - "web/src/protocol.ts"
      - "rust/crates/ca-core/**"
      - "rust/crates/ca-wasm/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/.cargo/config.toml"
      - ".github/workflows/shared-gpu-c2c.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/experiments/shared-gpu-c2c/**"
      - "web/scripts/*shared-gpu-c2c.mjs"
      - "web/scripts/build-shared-gpu-driver.mjs"
      - "web/scripts/*query-export.mjs"
      - "web/scripts/build-gpu-frontend.mjs"
      - "web/scripts/benchmark-inherited-bounds.mjs"
      - "web/scripts/benchmark-gpu-diagnostics.mjs"
      - "web/scripts/benchmark-box-bounds.mjs"
      - "web/tests/gpu-boxes.test.mjs"
      - "web/tests/gpu-box-bounds-packet.test.mjs"
      - "benchmarks/wasm-gpu-box-bounds/**"
      - "web/scripts/benchmark-parent-traversal.mjs"
      - "web/tests/gpu-parents.test.mjs"
      - "web/tests/gpu-parent-traversal-packet.test.mjs"
      - "benchmarks/wasm-gpu-parent-traversal/**"
      - "web/scripts/benchmark-compact-stack.mjs"
      - "web/tests/gpu-compact-stack.test.mjs"
      - "web/tests/gpu-compact-stack-packet.test.mjs"
      - "benchmarks/wasm-gpu-compact-stack/**"
      - "web/scripts/benchmark-packed-nodes.mjs"
      - "web/tests/gpu-packed-nodes.test.mjs"
      - "web/tests/gpu-packed-nodes-packet.test.mjs"
      - "benchmarks/wasm-gpu-packed-nodes/**"
      - "web/scripts/*reference-preparation*.mjs"
      - "web/tests/gpu-reference-preparation*.test.mjs"
      - "benchmarks/wasm-reference-preparation/**"
      - "web/tests/gpu-diagnostics.test.mjs"
      - "benchmarks/wasm-gpu-diagnostics/**"
      - "web/tests/inherited-bounds-packet.test.mjs"
      - "benchmarks/wasm-gpu-inherited-bounds/**"
      - "web/tests/query-export-packet.test.mjs"
      - "web/tests/owned-query-export-packet.test.mjs"
      - "benchmarks/wasm-owned-query-export/**"
      - "benchmarks/wasm-query-export/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/tests/shared-gpu-c2c-order.test.mjs"
      - "web/tests/shared-gpu-packets.test.mjs"
      - "benchmarks/wasm-shared-gpu-fresh/**"
      - "benchmarks/wasm-shared-gpu-overlap/**"
      - "benchmarks/wasm-shared-gpu-c2c/**"
      - "web/src/worker.ts"
      - "web/src/pool.ts"
      - "web/src/gpu-c2c.ts"
      - "web/src/gpu-candidates.ts"
      - "web/src/gpu-verifiers.ts"
      - "web/src/gpu-diagnostics.ts"
      - "web/src/c2c-worker.ts"
      - "web/src/protocol.ts"
      - "rust/crates/ca-core/**"
      - "rust/crates/ca-wasm/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/.cargo/config.toml"
      - ".github/workflows/shared-gpu-c2c.yml"

permissions:
  contents: read

jobs:
  shared-gpu-c2c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-20
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            web/experiments/shared-gpu-c2c
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check standalone Rust API
        run: |
          cargo +stable fmt --manifest-path web/experiments/shared-gpu-c2c/Cargo.toml --check
          cargo +stable clippy --manifest-path web/experiments/shared-gpu-c2c/Cargo.toml --all-targets --features threads --locked -- -D warnings
          cargo +stable test --manifest-path web/experiments/shared-gpu-c2c/Cargo.toml --locked
          cargo +stable test --manifest-path web/experiments/shared-gpu-c2c/Cargo.toml --features threads --locked
      - name: Build production and experimental WASM
        working-directory: web
        run: |
          npm ci
          node scripts/build-query-export.mjs --output query-export-build.json
          node scripts/build-gpu-frontend.mjs --output inherited-bounds-build.json --wasm-build-info query-export-build.json
          node scripts/build-shared-gpu-c2c.mjs serial
          node scripts/build-shared-gpu-c2c.mjs threads
          node node_modules/typescript/bin/tsc --noEmit -p experiments/shared-gpu-c2c/tsconfig.json
          node scripts/build-shared-gpu-driver.mjs
          node scripts/build-reference-preparation.mjs --output reference-preparation-build.json --out-dir reference-preparation-dist --wasm-build-info inherited-bounds-build.json
      - name: Verify static-host isolation and exact candidate verification
        working-directory: web
        run: |
          node --test tests/shared-gpu-c2c-order.test.mjs tests/shared-gpu-packets.test.mjs tests/query-export-packet.test.mjs tests/owned-query-export-packet.test.mjs tests/inherited-bounds-packet.test.mjs tests/gpu-diagnostics.test.mjs tests/gpu-boxes.test.mjs tests/gpu-box-bounds-packet.test.mjs tests/gpu-parents.test.mjs tests/gpu-parent-traversal-packet.test.mjs tests/gpu-compact-stack.test.mjs tests/gpu-compact-stack-packet.test.mjs tests/gpu-packed-nodes.test.mjs tests/gpu-packed-nodes-packet.test.mjs tests/gpu-reference-preparation.test.mjs tests/gpu-reference-preparation-packet.test.mjs
          npx playwright install --with-deps chromium
          node scripts/benchmark-query-export.mjs --output query-export-smoke.json --build-info query-export-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software
          node scripts/benchmark-owned-query-export.mjs --output owned-query-export-smoke.json --build-info query-export-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software
          node scripts/benchmark-inherited-bounds.mjs --output inherited-bounds-smoke.json --build-info inherited-bounds-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software
          node scripts/benchmark-gpu-diagnostics.mjs --output gpu-diagnostics-smoke.json --build-info inherited-bounds-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software
          node scripts/benchmark-box-bounds.mjs --output box-bounds-smoke.json --build-info inherited-bounds-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software --cold-first local
          node scripts/benchmark-parent-traversal.mjs --output parent-traversal-smoke.json --build-info inherited-bounds-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software --cold-first local
          node scripts/benchmark-compact-stack.mjs --output compact-stack-smoke.json --build-info inherited-bounds-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software --cold-first stack32
          node scripts/benchmark-packed-nodes.mjs --output packed-nodes-smoke.json --build-info inherited-bounds-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu software --cold-first flat
          node scripts/benchmark-reference-preparation.mjs --output reference-preparation-smoke.json --build-info reference-preparation-build.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --cycles 1 --row 0 --gpu software
          node scripts/benchmark-shared-gpu-c2c.mjs --output shared-gpu-c2c-smoke.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu disabled
          node scripts/benchmark-shared-gpu-c2c.mjs --output shared-gpu-c2c-fresh-smoke.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu disabled --jobs fresh
          node scripts/benchmark-shared-gpu-c2c.mjs --output shared-gpu-c2c-overlap-smoke.json --reference public/samples/lidar_reference.pcd --compared public/samples/lidar_candidate.pcd --threads 2 --warmups 0 --repeats 1 --gpu disabled --jobs fresh --overlap compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-gpu-c2c-smoke
          path: |
            web/shared-gpu-c2c-smoke.json
            web/shared-gpu-c2c-fresh-smoke.json
            web/shared-gpu-c2c-overlap-smoke.json
            web/inherited-bounds-build.json
            web/inherited-bounds-smoke.json
            web/gpu-diagnostics-smoke.json
            web/box-bounds-smoke.json
            web/parent-traversal-smoke.json
            web/compact-stack-smoke.json
            web/packed-nodes-smoke.json
            web/reference-preparation-build.json
            web/reference-preparation-smoke.json
            web/owned-query-export-smoke.json
            web/query-export-smoke.json
            web/query-export-build.json
