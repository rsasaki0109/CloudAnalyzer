name: Web

on:
  push:
    branches: [main]
    paths: ["rust/**", "web/**", "benchmarks/source-history/**", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["rust/**", "web/**", "benchmarks/source-history/**", ".github/workflows/web.yml"]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p ca-core --all-targets --features "parallel sqlite" -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p ca-core --features "parallel sqlite"

  web:
    # e2e is split across three runners (about 30 minutes in one job). Each
    # shard builds the app; lint, unit tests and the build artifact run once.
    name: web (e2e ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
      - name: Lint and unit tests
        if: matrix.shard == 1
        working-directory: web
        run: |
          npm run lint
          npm run test:unit
      - name: End-to-end tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: web/test-results
      - uses: actions/upload-artifact@v6
        if: matrix.shard == 1
        with:
          name: cloudanalyzer-web
          path: web/dist
