[package]
name = "ca-py"
description = "Python bindings for the CloudAnalyzer Rust core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rsasaki0109/CloudAnalyzer"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
ca-core = { path = "../ca-core", features = ["parallel"] }
numpy = "0.29.0"
rayon = "1.12.0"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
